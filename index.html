<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002124"><title>Consulta de documentos | Portal documental</title><link rel="stylesheet" href="assets/style.css"></head><body>
<div class="loader" id="loader"><div class="tube"><div class="liquid"></div></div></div>
<main class="layout"><section class="left"><div class="panel"><div class="brand">portal<span>docs</span><i>✧</i></div><div class="titleline"><span>←</span><h1>Consultar documento</h1></div><p class="subtitle">Descargar el documento</p>
