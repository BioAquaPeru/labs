<!doctype html><html lang="es"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002124"><title>Labsoft - Validar documento</title><link rel="stylesheet" href="assets/style.css"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="shortcut icon" href="assets/favicon.svg"></head><body>
<div class="loader" id="loader"><div class="tube"><div class="liquid"></div></div></div>
<main class="layout"><section class="left"><div class="panel"><div class="brand brand-confience"><span class="brand-text">confience.</span><span class="brand-mark" aria-hidden="true"><i class="n1"></i><i class="n2"></i><i class="n3"></i></span></div><div class="titleline"><span>←</span><h1>Validar documento</h1></div><p class="subtitle">Descargar el documento</p>
<div id="searchview"><label for="search-code">Número de Informe</label><div class="field"><input id="search-code" placeholder="Escribe un número de informe"><span>▤</span></div><button id="search-btn" class="btn">Consultar documento</button></div>
<div id="details" hidden><div class="entry"><label>Número de Informe</label><div class="field"><input id="v-number" readonly><span>▤</span></div></div><div class="entry"><label>Identificación</label><div class="field"><input id="v-label" readonly title="Identificación"><span>☷</span></div></div><div class="entry"><label>Fecha de Publicación</label><div class="field"><input id="v-date" readonly><span>▦</span></div></div><div class="buttons"><div class="qr-menu-wrap"><button class="btn" id="toggle-qr" type="button" aria-expanded="false">☷ &nbsp; QR Code <span id="arrow">⌄</span></button><div class="qr-menu" id="qr-menu" hidden><button type="button" id="scan-qr">☷ &nbsp; Lectura de Código QR</button><button type="button" id="upload-qr">⇧ &nbsp; Cargar archivo</button></div></div><button class="btn" id="download-btn">⇩ &nbsp; Descargar documento</button></div><input id="qr-file" type="file" accept="image/*" hidden><div class="qr-overlay" id="qr-overlay" hidden><div class="qr-dialog"><div class="qr-dialog-top"><strong>Lectura de Código QR</strong><button id="close-qr" type="button" aria-label="Cerrar">✕</button></div><div id="qr-reader"></div><p>Apunta la cámara al código QR del informe.</p></div></div></div>
<p id="message" role="status"></p><div class="footer">Powered by Confience</div></div><div class="bottom-note">▤<small> Ayuda</small></div></section><aside class="right"><canvas id="network"></canvas></aside></main>
